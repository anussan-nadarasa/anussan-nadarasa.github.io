name: Build and publish

# Every push runs the checks and builds the site, but nothing goes live until
# you press "Run workflow" on the Actions tab (Build and publish > Run workflow).
# One exception: a push that only adds to work logs (worklogs/*.json) goes
# live by itself, but only if nothing else has changed since the live version.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      auto: ${{ steps.auto.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: needed for dates and revision links

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Scan for patient-identifiable data
        run: python3 scripts/check_pii.py

      - name: Check whether only work logs changed since the live version
        id: auto
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/only_worklogs.py

      - name: Set file dates from git history
        run: python3 scripts/restore_mtime.py

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render       # runs scripts/validate.py first (TODOs are errors here)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || needs.build.outputs.auto == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
